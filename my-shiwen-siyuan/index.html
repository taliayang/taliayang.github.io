nt-size:13px;color:#74796b}@media(max-width:700px){header{margin:10px 12px;padding:12px 18px}.brand{display:none}.wrap{padding:0 22px}.hero{padding-top:42px;grid-template-columns:1fr;gap:25px}section.story{grid-template-columns:1fr;gap:10px;padding:35px 0}.section-label span{display:inline;margin-right:15px}nav{gap:8px}nav a{font-size:13px;padding:10px 13px}footer{flex-direction:column}}
.story-gallery{margin:28px 0}.story-gallery img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #e0e1d7}.story-gallery figcaption{font-size:13px;color:#74796b;margin-top:10px}.news-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.news-item{min-height:140px}.archive-link{display:inline-block;margin-top:24px;padding:12px 20px;border-radius:24px;background:#e7fa63;font-size:14px}@media(max-width:700px){.news-list{grid-template-columns:1fr}}.news-item{display:block;padding:20px 22px;border:1px solid #daddd1;border-radius:12px;background:#fafbf6}.news-item:hover{border-color:#83934f;background:#f3f6e6}.news-item small{display:block;color:#777;font-size:12px;margin-bottom:9px}.news-item span{font-size:16px;line-height:1.6}.activity-category{display:block;color:#687d30;font-size:13px;margin-bottom:16px;letter-spacing:.04em}.news-item .activity-description{font-size:14px;line-height:1.8;margin:12px 0 20px;color:#6c7165}.news-item small{display:block}.news-item{padding:24px}</style></head><body><header><a id="back" href="/#practice-team"></a><span class="brand">TALIA YANG</span><div><button id="zh" onclick="render('zh')">中文</button><button id="en" onclick="render('en')">English</button></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">FIELDWORK · CULTURE · DESIGN</div><h1 id="title"></h1><p class="role" id="role"></p><p id="subtitle"></p><p id="intro"></p><a class="site-link" id="site" href="http://swsy.top" target="_blank" rel="noopener noreferrer"></a></div><figure style="margin:0"><img src="/shiwen-siyuan-team.jpg" id="photo"><figcaption class="caption" id="caption"></figcaption></figure></div><nav id="nav" aria-label="Page sections"></nav><div id="sections"></div><footer><span id="footer"></span><a href="/#practice-team" id="back-bottom"></a></footer></main><script>
const copy={"zh": {"back": "← 返回个人主页", "title": "我的拾文思源", "subtitle": "关注本身就是价值。", "role": "杨拓拓 · 创始人、首任队长", "intro": "从一次偶然的邀请，到共同组建实践队，再到接过带领团队的责任，拾文思源让我逐渐理解：社会实践的意义，不只在于走过多少地方，更在于能否让真实的人与文化被看见。", "site": "访问团队官网 ↗", "nav": ["建队故事", "实践足迹", "合作与成果", "组织架构", "个人手记", "四类实践活动"], "sections": [["01", "建队故事", "从一次相遇，到一份责任", "本科初期，我在武术队认识的学长邀请我一起组建社会实践队。那时，我还不了解社会实践意味着什么；一次聚餐中定下的“拾文思源”，后来成为了我们持续走向田野的起点。\n\n在浙江，我们走访双林绫绢等非遗项目。与年轻传承人的交流让我意识到，传统并不是静止的符号，而是具体的人在时代变化中不断选择、坚持和创新。\n\n随着高年级成员逐渐毕业，我接过团队负责人的接力棒，并在学院支持下推进云南调研。从安排访谈到协调队员，我也开始学习：承担责任不仅是把任务完成，更是理解每个人的节奏，回应大家给予我的信任。", ""], ["02", "实践足迹", "从贝叶经出发，看见更多可能", "云南 · 与贝叶经相遇\n在昆明与西双版纳的调研中，我第一次接触贝叶经，并亲手体验刻写。当我在贝叶上刻下“拾文思源”时，一项陌生的传统技艺变成了一段具体的关系。回校后，我写下相关推文，逐步建立封面、排版与照片整理规范，将记录带到小红书和 bilibili。队友创作的“贝小叶”表情包与动画，又让我们看到新的传播可能。\n\n北京 · 在日常社区中理解传承\n当队员们回到各自家乡开展调研，我在北京东花市街道接触到社区博物馆式的非遗保护方式。实践不只发生在远方，也可以从身边的街道与日常生活开始。\n\n中阳与昆明 · 让实践继续生长\n2024年夏，团队在山西中阳尝试联合支教与异地策展。我因个人行程未能到场，这段经历却让我更深切地理解了沟通、协作与团队信任的重要性。同年再次赴昆明、走访云南省非遗中心时，我也开始从不同机构的视角理解文化保护。", ""], ["03", "合作与成果", "让校园之外的人看见", "从记录到连接\n关于贝叶经的内容陆续吸引了其他高校的实践团队与研究者。2025年初，央视栏目组通过小红书联系到我们，希望了解调研资料。我们协助对接云南省非遗中心，促成沟通与合作；最终，相关视频片尾出现了“拾文思源实践队”的名字。\n\n从个人努力到共同实践\n团队联动中国美术馆、杭州工艺美术博物馆、云南省非物质文化遗产保护中心等文化机构与社会主体，探索文化交流与联合实践。影像记录、文创设计、公益展览和校园及中小学非遗课堂，让田野材料有机会进入更多人的生活。\n\n这些连接来自一通通电话、一封封邮件，也来自队员们各自擅长的创作。对我而言，成果不仅是一份报告或一项荣誉，更是原本没有交集的人，因为共同关注而相遇。", ""], ["04", "组织架构", "我如何搭建团队的工作体系", "带队过程中，我逐步构建了对内组织与对外实践相互支撑的工作架构：对内让成员有清晰的分工、可学习的经验和能够接续的工作；对外将非遗调研转化为课程、交流、展览与公共文化活动。\n\n对内：成员培养与日常运营\n我推动建立内容传播的视觉与排版规范，通过老带新、资料归档和经验分享支持成员成长，将假期集中调研与学期持续运营衔接起来。“退休不退队”的顾问机制，让往届成员的经验继续服务团队。\n\n工作内容：五条相互支撑的方向\n团队以“拾文承韵”（非遗保护与研究）、“拾文新芽”（教学与传播）、“拾文雅礼”（文创设计）、“拾文行思”（思考与总结）和“拾文映像”（美育策展）组织成果，让不同专业与兴趣的成员找到参与方式。\n\n对外：活动策划与社会协作\n我将活动策划、资源联络与成果传播连接起来，推动团队从校园走向公共文化空间。对外实践可以从校内博雅、北京市活动、校际活动与社会活动四个层面展开；下方各选一项团队记录，呈现这套架构如何落地。", ""], ["05", "个人手记", "从做好一次实践，到让团队走下去", "“让社会实践为社会做事，而不是停在校园里才是社会实践的根本意义。”\n\n早期带队时，我更关心调研、材料与成果是否按时完成。后来我学会了关注成员本身：让每个人做擅长且热爱的事，给不同的节奏留出空间，让老队员与新队员相互支持。\n\n工作重心也逐渐从“如何做好实践”转向“如何让团队成长”。看到新的成员接过工作，带来旅游地图、线上平台等新的尝试，我开始理解，团队的延续本身也是一种传承。\n\n回望这些经历，方向并非一开始就清楚。是一次次相遇、尝试与承担，让文化观察、设计实践和研究兴趣慢慢连接起来。关注本身就是价值，而持续的行动，让这份关注拥有了更长久的可能。", ""], ["06", "四类实践活动", "让组织架构落到具体行动", "围绕我推动建立的工作体系，团队持续开展不同层面的实践。以下按四类展示代表活动；日期为宣传总表中的记录日期。", ""]], "pending": "内容整理中", "footer": "根据《关注本身就是价值》及本科生涯回顾整理 · 杨拓拓 · 结合团队入队指南整理", "alt": "拾文思源实践队合照", "gallery": {"fieldwork": [{"src": "assets/fieldwork-collage.jpg", "caption": "实践调研与现场记录"}], "collaboration": [{"src": "assets/design-outcomes.jpg", "caption": "文创设计与成果展示"}, {"src": "assets/editorial-series.png", "caption": "团队传播内容与视觉系列"}], "continuity": [{"src": "assets/learning-resources.png", "caption": "队内学习与经验传承"}]}, "news": [{"date": "24.11.17", "platform": "微言航语", "url": "https://mp.weixin.qq.com/s?__biz=MzAxODM2Mzg3Ng==&mid=2650579852&idx=1&sn=1e978af80adbc0644085fa3dea1fbd81&chksm=820013432d3c7401974590fa3bd046feaac70da06b9e4dbc799a1f3611987044a1bd9dae7212&scene=27", "category": "01 · 校内博雅", "title": "校内博雅活动", "description": "面向校内同学的文化学习与体验。"}, {"date": "26.3.11", "platform": "北航校史与文博馆", "url": "https://mp.weixin.qq.com/s/ElEm0VO4NheatkYtC3VFpg", "category": "02 · 北京市活动", "title": "首都教育系统女教职工螺钿手作饰品展", "description": "将非遗手作带入首都教育系统的公共文化活动。"}, {"date": "24.7.31", "platform": "长安大学公路学院", "url": "https://mp.weixin.qq.com/s/LhkR6lvwma46IGHDTme6mQ", "category": "03 · 校际活动", "title": "与长安大学团队联合支教", "description": "通过跨校协作开展教学与文化传播。"}, {"date": "24.7.23", "platform": "中阳县政府网", "url": "http://www.sxzhongyang.gov.cn/zwyw/zwyw_29948/202407/t20240723_1883759.shtml", "category": "04 · 社会活动", "title": "中阳乡村艺术展览", "description": "将学生创作带到乡村，让艺术走向公共生活。"}]}, "en": {"back": "← Back to portfolio", "title": "My Shiwen Siyuan Journey", "subtitle": "Attention is a form of value in itself.", "role": "Tuotuo Yang · Founder & Founding Captain", "intro": "An unexpected invitation led me to help build a team and later take on the responsibility of leading it. Through Shiwen Siyuan, I came to understand that fieldwork matters not simply because of the places we visit, but because of the people and cultures we help others see.", "site": "Visit team website ↗", "nav": ["Beginnings", "Fieldwork", "Collaboration & Outcomes", "Team Structure", "Reflections", "Four Areas of Practice"], "sections": [["01", "Beginnings", "An encounter, then a responsibility", "Early in my undergraduate studies, a senior student I met through the university martial arts team invited me to help form a fieldwork team. I did not yet know what social practice would involve. The name Shiwen Siyuan, chosen over a shared meal, became the starting point for a continuing journey.\n\nIn Zhejiang, visits to heritage practices such as Shuanglin silk weaving changed my understanding of tradition. Conversations with a young practitioner showed me that heritage is not a static symbol, but a series of choices, commitments, and innovations made by real people.\n\nAs senior members graduated, I took on the responsibility of leading the team and organized fieldwork in Yunnan with support from our school. Arranging interviews and coordinating the group taught me that leadership means more than completing tasks: it means understanding people’s rhythms and honoring their trust.", ""], ["02", "Fieldwork", "Starting with palm-leaf manuscripts", "Yunnan · Encountering palm-leaf manuscripts\nIn Kunming and Xishuangbanna, I encountered palm-leaf manuscripts and tried inscribing them myself. Carving our team’s name into a leaf turned an unfamiliar craft into a personal connection. Back on campus, I wrote about the experience and helped establish consistent editorial, layout, and photographic practices for our channels, including Xiaohongshu and bilibili. A teammate’s Bei Xiaoye stickers and animation opened up further possibilities for communication.\n\nBeijing · Heritage in everyday neighborhoods\nWhen team members returned to their hometowns for fieldwork, I visited Donghuashi in Beijing and encountered a community-museum approach to heritage protection. Fieldwork could begin on familiar streets, not only in distant places.\n\nZhongyang and Kunming · Extending our practice\nIn summer 2024, the team explored joint educational activities and an exhibition in Zhongyang, Shanxi. I was unable to attend in person because of other commitments, but the experience deepened my understanding of coordination and trust. Returning to Kunming that summer and visiting the provincial heritage center also helped me understand preservation from different institutional perspectives.", ""], ["03", "Collaboration & Outcomes", "Reaching beyond campus", "From documentation to connection\nOur palm-leaf manuscript coverage attracted other university fieldwork teams and researchers. In early 2025, a CCTV production team contacted us through Xiaohongshu to ask about our materials. We helped connect them with the Yunnan Provincial Intangible Cultural Heritage Protection Center; the resulting video acknowledged Shiwen Siyuan in its closing credits.\n\nFrom individual effort to shared practice\nThe team connects with cultural institutions and community partners, including the National Art Museum of China, Hangzhou Arts and Crafts Museum, and the Yunnan Provincial Intangible Cultural Heritage Protection Center. Documentary media, cultural product design, public exhibitions, and heritage workshops for university and school audiences help bring fieldwork into everyday life.\n\nThese connections grew through individual calls and emails, and through each member’s creative strengths. For me, an outcome is more than a report or an award: it is also a meeting between people who would otherwise have remained strangers.", ""], ["04", "Team Structure", "Building a framework for the team", "As team leader, I gradually built a working structure connecting internal organization with outward-facing practice: clear responsibilities, shared knowledge, and continuity within the team; courses, exchanges, exhibitions, and public cultural activities beyond it.\n\nWithin the team: learning and operations\nI helped establish visual and editorial standards, supported mentoring and shared archives, and connected vacation fieldwork with ongoing work during term. Former members continue to contribute as advisers, keeping experience available to newer members.\n\nFive complementary strands\nShiwen Chengyun focuses on heritage protection and research; Shiwen Xinya on teaching and communication; Shiwen Yali on cultural product design; Shiwen Xingsi on reflection; and Shiwen Yingxiang on arts education and exhibitions. These strands offer members with different skills and interests ways to contribute.\n\nBeyond the team: planning and collaboration\nI connected activity planning, partner outreach, and communication to help the team reach public cultural spaces. Four areas illustrate this work: campus liberal education, Beijing-wide activities, inter-university collaboration, and community engagement. The selected team records below show one example in each area.", ""], ["05", "Reflections", "Beyond one project: helping a team endure", "“The purpose of social practice is to serve society, rather than remain within the campus.” — translated from my original essay\n\nAt first, I focused on completing fieldwork, organizing materials, and delivering outcomes. Over time, I learned to pay closer attention to team members: to help people do what they enjoy and do well, make space for different working rhythms, and support exchanges between newer and more experienced members.\n\nMy focus gradually shifted from delivering a successful project to helping the team grow. Watching new members take responsibility and introduce ideas such as visitor maps and online platforms showed me that continuity is itself a form of heritage.\n\nLooking back, my direction was not clear from the beginning. Encounters, experiments, and responsibilities gradually connected cultural observation, design practice, and research. Attention is a form of value; sustained action gives that attention a future.", ""], ["06", "Four Areas of Practice", "Putting the structure into action", "The team continues to develop activities through the working framework I helped establish. These records illustrate four areas of practice; dates follow the publicity log.", ""]], "pending": "Content in preparation", "footer": "Adapted from my personal essays · Tuotuo Yang · With material from the team onboarding guide", "alt": "Shiwen Siyuan Practice Team group photo", "gallery": {"fieldwork": [{"src": "assets/fieldwork-collage.jpg", "caption": "Fieldwork and on-site documentation"}], "collaboration": [{"src": "assets/design-outcomes.jpg", "caption": "Cultural product designs and outcomes"}, {"src": "assets/editorial-series.png", "caption": "Editorial content and visual series"}], "continuity": [{"src": "assets/learning-resources.png", "caption": "Learning resources and knowledge sharing"}]}, "news": [{"date": "24.11.17", "platform": "微言航语", "url": "https://mp.weixin.qq.com/s?__biz=MzAxODM2Mzg3Ng==&mid=2650579852&idx=1&sn=1e978af80adbc0644085fa3dea1fbd81&chksm=820013432d3c7401974590fa3bd046feaac70da06b9e4dbc799a1f3611987044a1bd9dae7212&scene=27", "category": "01 · Campus Liberal Education", "title": "Campus liberal education activities", "description": "Cultural learning and engagement for students on campus."}, {"date": "26.3.11", "platform": "北航校史与文博馆", "url": "https://mp.weixin.qq.com/s/ElEm0VO4NheatkYtC3VFpg", "category": "02 · Beijing-wide Activities", "title": "Mother-of-pearl craft exhibition for women educators", "description": "Bringing heritage crafts into cultural activities across Beijing’s education community."}, {"date": "24.7.31", "platform": "长安大学公路学院", "url": "https://mp.weixin.qq.com/s/LhkR6lvwma46IGHDTme6mQ", "category": "03 · Inter-university Collaboration", "title": "Joint educational outreach with a Chang’an University team", "description": "Cross-university collaboration in educational and cultural outreach."}, {"date": "24.7.23", "platform": "中阳县政府网", "url": "http://www.sxzhongyang.gov.cn/zwyw/zwyw_29948/202407/t20240723_1883759.shtml", "category": "04 · Community Engagement", "title": "Community art exhibition in Zhongyang", "description": "Bringing student artwork into rural communities and public life."}]}};const ids=['beginnings','fieldwork','collaboration','continuity','reflections','news'];function render(lang){const c=copy[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=c.title+' — Talia Yang';for(const id of ['back','title','role','subtitle','intro','site','footer'])document.getElementById(id).textContent=c[id];document.getElementById('back-bottom').textContent=c.back;document.getElementById('photo').alt=c.alt;document.getElementById('caption').textContent=c.alt;document.getElementById('zh').setAttribute('aria-pressed',lang==='zh');document.getElementById('en').setAttribute('aria-pressed',lang==='en');document.getElementById('nav').innerHTML=c.nav.map((v,i)=>`<a href="#${ids[i]}">${v}</a>`).join('');document.getElementById('sections').innerHTML=c.sections.map((s,i)=>`<section class="story" id="${ids[i]}"><div class="section-label"><span>${s[0]}</span>${s[1]}</div><div><h2>${s[2]}</h2>${s[3]?s[3].split("\n\n").map(p=>`<p class="known">${p.replaceAll("\n","<br>")}</p>`).join(""):''}${s[4]?`<div class="placeholder"><small>${c.pending}</small><p>${s[4]}</p></div>`:""}${ids[i]==="news"?`<div class="news-list">${c.news.map(v=>`<a class="news-item" href="${v.url.replaceAll("&","&amp;").replaceAll('"',"&quot;")}" target="_blank" rel="noopener noreferrer"><strong class="activity-category">${v.category}</strong><span>${v.title} ↗</span><p class="activity-description">${v.description}</p><small>${v.date} · ${v.platform}</small></a>`).join("")}</div><a class="archive-link" href="records/${lang==='en'?'?lang=en':''}">${lang==='zh'?'查看全部记录 →':'View all records →'}</a>`:""}${(c.gallery[ids[i]]||[]).map(g=>`<figure class="story-gallery"><a href="${g.src}" target="_blank" rel="noopener"><img loading="lazy" src="${g.src}" alt="${g.caption}"></a><figcaption>${g.caption}</figcaption></figure>`).join("")}</div></section>`).join('');}render(new URLSearchParams(location.search).get('lang')==='en'?'en':'zh');</script></body></html>
