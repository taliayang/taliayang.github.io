const copy={"zh": {"back": "← 返回个人主页", "title": "我的拾文思源", "subtitle": "关注本身就是价值。", "role": "杨拓拓 · 创始人、首任队长", "intro": "从一次偶然的邀请，到共同组建实践队，再到接过带领团队的责任，拾文思源让我逐渐理解：社会实践的意义，不只在于走过多少地方，更在于能否让真实的人与文化被看见。", "site": "访问团队官网 ↗", "nav": ["建队故事", "实践足迹", "合作与成果", "组织架构", "四类实践活动", "个人手记", "实践成果", "荣誉记录", "致谢"], "sections": [["01", "建队故事", "从一次相遇，到一份责任", "本科初期，我在武术队认识的学长邀请我一起组建社会实践队。那时，我还不了解社会实践意味着什么；一次聚餐中定下的“拾文思源”，后来成为了我们持续走向田野的起点。\n\n在浙江，我们走访双林绫绢等非遗项目。与年轻传承人的交流让我意识到，传统并不是静止的符号，而是具体的人在时代变化中不断选择、坚持和创新。\n\n随着高年级成员逐渐毕业，我接过团队负责人的接力棒，并在学院支持下推进云南调研。从安排访谈到协调队员，我也开始学习：承担责任不仅是把任务完成，更是理解每个人的节奏，回应大家给予我的信任。", ""], ["02", "实践足迹", "实践足迹", "", ""], ["03", "合作与成果", "让校园之外的人看见", "从记录到连接\n关于贝叶经的内容陆续吸引了其他高校的实践团队与研究者。2025年初，央视栏目组通过小红书联系到我们，希望了解调研资料。我们协助对接云南省非遗中心，促成沟通与合作；最终，相关视频片尾出现了“拾文思源实践队”的名字。\n\n从个人努力到共同实践\n团队联动中国美术馆、杭州工艺美术博物馆、云南省非物质文化遗产保护中心等文化机构与社会主体，探索文化交流与联合实践。影像记录、文创设计、公益展览和校园及中小学非遗课堂，让田野材料有机会进入更多人的生活。\n\n这些连接来自一通通电话、一封封邮件，也来自队员们各自擅长的创作。对我而言，成果不仅是一份报告或一项荣誉，更是原本没有交集的人，因为共同关注而相遇。", ""], ["04", "组织架构", "我如何搭建团队的工作体系", "带队过程中，我逐步构建了对内组织与对外实践相互支撑的工作架构：对内让成员有清晰的分工、可学习的经验和能够接续的工作；对外将非遗调研转化为课程、交流、展览与公共文化活动。\n\n对内：成员培养与日常运营\n我推动建立内容传播的视觉与排版规范，通过老带新、资料归档和经验分享支持成员成长，将假期集中调研与学期持续运营衔接起来。“退休不退队”的顾问机制，让往届成员的经验继续服务团队。\n\n工作内容：五条相互支撑的方向\n团队以“拾文承韵”（非遗保护与研究）、“拾文新芽”（教学与传播）、“拾文雅礼”（文创设计）、“拾文行思”（思考与总结）和“拾文映像”（美育策展）组织成果，让不同专业与兴趣的成员找到参与方式。\n\n对外：活动策划与社会协作\n我将活动策划、资源联络与成果传播连接起来，推动团队从校园走向公共文化空间。对外实践可以从校内博雅、北京市活动、校际活动与社会活动四个层面展开；下方各选一项团队记录，呈现这套架构如何落地。", ""], ["05", "四类实践活动", "让组织架构落到具体行动", "围绕我推动建立的工作体系，团队持续开展不同层面的实践。以下按四类展示代表活动；日期为宣传总表中的记录日期。", ""], ["06", "个人手记", "从做好一次实践，到让团队走下去", "“让社会实践为社会做事，而不是停在校园里才是社会实践的根本意义。”\n\n早期带队时，我更关心调研、材料与成果是否按时完成。后来我学会了关注成员本身：让每个人做擅长且热爱的事，给不同的节奏留出空间，让老队员与新队员相互支持。\n\n工作重心也逐渐从“如何做好实践”转向“如何让团队成长”。看到新的成员接过工作，带来旅游地图、线上平台等新的尝试，我开始理解，团队的延续本身也是一种传承。\n\n回望这些经历，方向并非一开始就清楚。是一次次相遇、尝试与承担，让文化观察、设计实践和研究兴趣慢慢连接起来。关注本身就是价值，而持续的行动，让这份关注拥有了更长久的可能。", ""], ["07", "实践成果", "从田野记录到公共文化成果", "传播｜全媒体宣传矩阵\n搭建公众号、小红书、哔哩哔哩、抖音、视频号、小程序与网页等传播渠道，通过图文、视频和线上展陈，让匠人故事与田野材料触达更多青年。\n\n体验｜非遗走入校园与社区\n通过博雅讲堂、外场展示、中小学课堂与公益美育，把调研积累转化为能够参与的文化体验。2025年寒假为首师大丽泽中学带来烧箔画课堂；2026年暑期在兰州开展非遗手工公益课堂。\n\n转化｜研究、设计与在地应用\n从贝小叶表情包与便签，到“中阳礼物”、企业包装、文旅地图及中轴线数字体验APP，团队将田野素材持续转化为研究报告、文创产品与交互工具。2026年暑期进一步完成绥中苹果、白梨IP与包装设计，探索设计助农。", ""], ["08", "荣誉记录", "共同积累，也见证个人成长", "团队与项目荣誉\n2023年北航暑期社会实践一等奖、“科技领航行动”最佳实践队伍；2023、2024年“青年服务国家”首都大学生暑期社会实践优秀团队；2024年北航寒假、暑期社会实践二等奖；2025年北航寒假社会实践“社会观察”赛道一等奖；2025年北航暑期社会实践一等奖；2026年北航寒假社会实践一等奖；2026年北航暑期社会实践优秀团队一等奖。\n\n创新创业\n2025年“青创北京”挑战杯首都大学生课外学术科技作品竞赛：主赛道特等奖；“青砺基层”社会治理专项赛特等奖（擂主）。\n\n个人社会实践荣誉\n我获2023、2024年“青年服务国家”首都大学生暑期社会实践先进个人、北航社会实践先进个人，以及2022—2023、2023—2024年度校级社会实践特等奖学金。", ""], ["09", "致谢", "让一份热爱成为共同的行动", "感谢新媒体艺术与设计学院的指导与支持，感谢各地非遗保护中心、传承基地与非遗传承人的分享，感谢合作学校、文化机构及社会伙伴的协作，也感谢历届队员与一路相伴的老师、同学。\n\n拾捧文化命脉，思取精神源泉。未来，我期待这套由共同实践积累的工作体系，继续支持新的成员走向田野，让文化传承融入日常。", ""]], "pending": "内容整理中", "footer": "根据《关注本身就是价值》及本科生涯回顾整理 · 杨拓拓 · 结合团队入队指南整理", "alt": "拾文思源实践队合照", "gallery": {"fieldwork": [{"src": "assets/fieldwork-collage.jpg", "caption": "实践调研与现场记录"}], "collaboration": [{"src": "assets/design-outcomes.jpg", "caption": "文创设计与成果展示"}, {"src": "assets/editorial-series.png", "caption": "团队传播内容与视觉系列"}], "continuity": [{"src": "assets/learning-resources.png", "caption": "队内学习与经验传承"}]}, "news": [{"date": "24.11.17", "platform": "微言航语", "url": "https://mp.weixin.qq.com/s?__biz=MzAxODM2Mzg3Ng==&mid=2650579852&idx=1&sn=1e978af80adbc0644085fa3dea1fbd81&chksm=820013432d3c7401974590fa3bd046feaac70da06b9e4dbc799a1f3611987044a1bd9dae7212&scene=27", "category": "01 · 校内博雅", "title": "“能工巧匠”博雅课堂", "description": "面向校内同学的文化学习与体验。"}, {"date": "26.3.11", "platform": "北航校史与文博馆", "url": "https://mp.weixin.qq.com/s/ElEm0VO4NheatkYtC3VFpg", "category": "02 · 北京市活动", "title": "首都教育系统女教职工螺钿手作饰品展", "description": "将非遗手作带入首都教育系统的公共文化活动。"}, {"date": "24.7.31", "platform": "长安大学公路学院", "url": "https://mp.weixin.qq.com/s/LhkR6lvwma46IGHDTme6mQ", "category": "03 · 校际活动", "title": "与长安大学团队联合支教", "description": "通过跨校协作开展教学与文化传播。"}, {"date": "24.7.23", "platform": "中阳县政府网", "url": "http://www.sxzhongyang.gov.cn/zwyw/zwyw_29948/202407/t20240723_1883759.shtml", "category": "04 · 社会活动", "title": "中阳乡村艺术展览", "description": "将学生创作带到乡村，让艺术走向公共生活。"}], "timeline": [["2022 寒假", "文化源远流长，探寻非遗宝藏", "湖州、杭州 · 非遗初访", "浙江湖州、杭州；从非遗走访与初步调研开启实践旅程。", "湖州、杭州"], ["2023 暑期", "云滇拾遗 · 青年在路上", "云南 · 访谈记录与创意传播", "田野调研｜走进云南的非遗现场\n2023年暑期，13名队员赴云南，采访7位国家级、2位自治州级及20余位市级非遗传承人，围绕技艺起源、传承心得、现实困境与未来期待开展访谈。累计采访30小时，整理53,500余字逐字稿，为后续研究与传播积累一手材料。\n\n创意转化｜从贝叶经到“贝小叶”\n团队制作贝叶经手书动画、“贝小叶”表情包、傣陶项链等作品，并搭建线上展厅，将非遗知识转化为青年容易接触和使用的视觉内容与文创产品。我参与贝叶经调研与推文写作，并逐步建立封面、图文排版与照片整理规范。\n\n传播成果｜让匠人的故事被看见\n通过图文与视频记录非遗匠人和技艺，相关图文阅读量超过1万人次，视频全网浏览量超过36,000次。贝叶经相关内容也成为团队向小红书、哔哩哔哩等平台拓展的起点。\n\n阶段荣誉\n获北京航空航天大学2023年暑期社会实践一等奖、“科技领航行动”实践品牌项目“最佳实践队伍”，以及2023年“青年服务国家”首都大学生暑期社会实践优秀团队。", "云南"], ["2024 寒假", "非遗、民俗“艺”起来", "家乡民俗 · 七省非遗调研", "实践主题｜我身边的民俗记忆\n2024年寒假，15名队员前往全国7省，围绕各地记忆中的节日氛围，调研9项非物质文化遗产，观察传统习俗在当代生活中的延续与变化。我在北京东花市街道了解社区博物馆式的非遗保护，让实践从身边的街道与生活展开。\n\n内容与设计｜让非遗融入青年生活\n本期形成25篇新闻推送、1部介绍视频与3项新文创。队员记录匠人与产品故事，围绕非遗保护整理专题论文，搭建线上网页；结合北航元素设计贝小叶便利贴、国风非遗元素便签等产品。相关文创上线后一天内售出50份。\n\n回访湖州｜让调研成为持续的关系\n团队回到建队后的第一站浙江湖州，走访湖州市文化馆，了解非遗游学、全民非遗等保护与传播方式，并进一步认识地方剧种湖剧。双方围绕“非遗进校园”与非遗发展交流，探索后续合作的可能。\n\n阶段荣誉\n获北京航空航天大学2024年寒假社会实践二等奖。", "七省 · 含北京、浙江"], ["2024 暑期", "寻古东方，晋航相约", "山西 · 乡村设计、美育与支教", "实践范围｜以山西为主线，连接文化与乡村\n2024年暑期，20名队员赴山西、云南等地开展近两个月实践，以山西平遥、吕梁、大同等地为主要实践线索。我因个人行程未能到中阳现场，这一阶段的团队协作也让我更深刻地理解沟通与信任。\n\n设计助乡｜“中阳礼物”与阳坡村文旅\n围绕中阳剪纸、柏洼手工制醋等地方文化，团队设计非遗主题标识与文创10余套，为当地企业设计包装、礼盒近10套，并为阳坡村构建包含IP、路牌和旅游地图的文旅品牌方案，将设计能力用于地方文化传播与产业需求。\n\n美育与支教｜“晋航相约”艺术展\n团队助力北航与阳坡村共建“艺术乡建中心”社会实践基地，参与“红色1+1”联合活动，举办“晋航相约”艺术展；在山西临县前青塘中学开展支教，将航空航天知识与非遗文化带入课堂。\n\n传播与交流｜官网、媒体与公众活动\n建设团队文化宣传官网，微信发布39篇推送，关注人数突破1,000；本期材料记录经济合作6项、主流平台报道45篇。团队参与“博雅课堂”“京采青春”“央视IP进北航”等活动，并向来自4个国家、6个地区的国际友人推广非遗。\n\n研究转化｜让田野材料进入研究与创新\n围绕10大非遗项目的乡村存续情况，与文旅部门和非遗中心交流，形成6万字调研报告、2篇学术论文、3项北京市大学生创新创业立项，并制作发布30项作品。\n\n阶段荣誉\n获北京航空航天大学2024年暑期社会实践“社会观察”赛道二等奖，以及2024年“青年服务国家”首都大学生暑期社会实践优秀团队。", "山西"], ["2025 寒假", "轴线传韵，非遗赋彩", "北京中轴线 · 数字赋能非遗", "实践主题｜轴线传韵，非遗赋彩\n围绕北京中轴线与非遗的共生关系，团队以“一体八维”为实践框架，探索“寻脉—焕新—传薪”的文化传承路径，将实地调研、数字设计、公众教育和学术研究相衔接。\n\n深度调研｜建筑遗产与活态技艺\n队员徒步中轴线7.8公里，走访15个遗产点，积累1.5小时音视频与1.2万字采风笔记。深入16处非遗传习所，对话20余位国家级、省级传承人，拍摄10余小时访谈视频、整理超过9万字逐字稿，了解11项非遗技艺的存续现状。\n\n社会协作｜文博、文旅与中学课堂\n在93号院博物馆交流非遗保护，在中国工艺美术馆参观春节主题展并收集问卷；与西城区文旅局探讨青年参与及科技传播。团队还为首师大丽泽中学学生开设烧箔画课堂，探索“非遗进校园”的长效合作。\n\n数字设计｜地图、表情包、文创与APP\n团队复原走马灯“鳌”纹样，设计“中轴线·非遗”数字地图、京剧动态表情包和中轴纹样文创，开发整合“文化学习—地图导航—互动反馈”的数字体验APP，让文化信息转化为可探索的交互体验。\n\n传播与研究｜从记录到系统成果\n公众号与小红书发布30余篇内容，关注量增长15%；视频平台发布近30条视频，播放量超过3万。成果获10余家媒体报道20篇、阅读量超过8万，并凝练形成8万字非遗与中轴线共生策略研究报告。\n\n阶段荣誉\n获北京航空航天大学2025年寒假社会实践“社会观察”赛道一等奖。", "北京"], ["2025 暑期", "遗韵巴蜀，共创品牌", "巴蜀文化 · 调研与品牌共创", "围绕巴蜀文化开展田野调研与设计实践。\n\n阶段荣誉\n获北京航空航天大学2025年暑期社会实践一等奖。", "四川"], ["2026 寒假", "拾运河文脉，思非遗源流", "运河沿线 · 天津、山东调研", "沿运河开展非遗调研，赴天津、山东探访文化传承。\n\n阶段荣誉\n获北京航空航天大学2026年寒假社会实践一等奖。", "运河沿线"], ["2026 暑期", "筑牢民族文化认同共同体 · 一带一路", "五省十三地 · 调研、科创与公益", "主题与路径｜筑牢民族文化认同共同体 · 一带一路\n2026年暑期，团队成员来自北航三个校区、14个学院，沿丝路文脉、农遗传承、红色记忆三条主线，奔赴新疆、甘肃、陕西、江西、辽宁五省十三地，开展“预先调研—实地探访—数字化记录”全流程实践。\n\n田野积累｜文化项目、场馆与传承人\n本期调研87个文化项目、走访22座博物馆与文化场馆、深度访谈20位非遗传承人，涉及新疆花儿、维吾尔族花帽、纳孜库姆、敦煌壁画、秦腔等。积累100余小时录音、二十余万字访谈材料，形成2万字农业文化遗产论文、7万余字综合研究报告与3万字产业调研报告，并向各地文旅主管部门递送成果。\n\n融媒传播｜让田野内容持续可见\n覆盖七大平台，以Vlog、图文、IP形象、专题网页和实践APP等二十余种形式传播。团队建设线上展陈与文化存档APP，编撰《拾文思源的非遗小书》。本期材料记录84篇媒体报道；自制微电影《非遗·中轴》入选北航主题班会素材，首发播放量破万。\n\n设计赋能｜从文创到地方产业\n完成14项文创设计，获得7项国家级、省级竞赛奖项。团队与绥中农垦集团合作，完成绥中苹果、白梨IP视觉与包装设计，文创产品进入沈阳故宫文创市集；形成《数智赋农、果兴辽西》报告，提出果品溯源与数字服务方案。同时围绕哈密瓜、临潼石榴、坎儿井等农业遗产开展案例研究。\n\n公益美育｜走进基层与校园\n在兰州面向铁路职工子女、外来务工随迁子女开设非遗手工公益课堂，体验花草纸灯笼等技艺；承接北京市科协“艺起守安”红色墙画任务，并开展乡村非遗体验。团队还承办学院路、沙河两校区校工会中秋博雅文化活动，为学校社会实践课程设计专属IP。\n\n六环协同与阶段荣誉\n以田野调研、学术研究、媒体传播、科创文创、公益服务、校地联动六个环节连接实践。获北京航空航天大学2026年暑期社会实践优秀团队一等奖。以上均为本期成果，与此前累计数据分别呈现。", "五省十三地"]], "overview": "从2022年12月建队出发，拾文思源在新媒体艺术与设计学院指导下持续发展。以下为团队概况材料中的阶段性累计数据；不同年度的成果另列，避免重复相加。", "stats": [["85", "历届成员"], ["11", "省市足迹"], ["73", "非遗项目"], ["30+", "外场与博雅活动"], ["26", "荣誉"]], "expand": "展开成果与细节", "regions": [["北京", "中轴线与东花市", "传统手工艺、社区非遗与文博交流"], ["山西", "中阳 · 平遥 · 大同", "剪纸、传统制醋、乡村文创与美育"], ["四川", "成都 · 绵阳 · 凉山", "蜀绣、羌绣、彝族工艺与皮影"], ["云南", "昆明 · 西双版纳", "贝叶经、傣族织锦与制陶、金属工艺"], ["浙江", "湖州 · 安吉 · 杭州", "双林绫绢、白茶、制扇与工艺美术"], ["山东", "济南 · 聊城 · 济宁", "运河文化、刻书、塑作与鲁锦"], ["天津", "天津", "风筝与葫芦工艺"], ["江苏", "扬州", "木偶戏、清曲与古琴"], ["新疆", "乌鲁木齐 · 吐鲁番 · 哈密", "花儿、纳孜库姆、坎儿井与农业文化遗产"], ["陕西", "西安 · 临潼", "鼓乐、秦腔、造纸与石榴农业遗产"], ["甘肃", "兰州等地", "非遗公益课堂与文化调研"]], "regionHeading": "按地区看实践足迹", "regionNote": "以线下调研记录及历年实践材料整理，选取代表地点与主题。"}, "en": {"back": "← Back to portfolio", "title": "My Shiwen Siyuan Journey", "subtitle": "Attention is a form of value in itself.", "role": "Tuotuo Yang · Founder & Founding Captain", "intro": "An unexpected invitation led me to help build a team and later take on the responsibility of leading it. Through Shiwen Siyuan, I came to understand that fieldwork matters not simply because of the places we visit, but because of the people and cultures we help others see.", "site": "Visit team website ↗", "nav": ["Beginnings", "Fieldwork", "Collaboration & Outcomes", "Team Structure", "Four Areas of Practice", "Reflections", "Outcomes", "Honors", "Acknowledgments"], "sections": [["01", "Beginnings", "An encounter, then a responsibility", "Early in my undergraduate studies, a senior student I met through the university martial arts team invited me to help form a fieldwork team. I did not yet know what social practice would involve. The name Shiwen Siyuan, chosen over a shared meal, became the starting point for a continuing journey.\n\nIn Zhejiang, visits to heritage practices such as Shuanglin silk weaving changed my understanding of tradition. Conversations with a young practitioner showed me that heritage is not a static symbol, but a series of choices, commitments, and innovations made by real people.\n\nAs senior members graduated, I took on the responsibility of leading the team and organized fieldwork in Yunnan with support from our school. Arranging interviews and coordinating the group taught me that leadership means more than completing tasks: it means understanding people’s rhythms and honoring their trust.", ""], ["02", "Fieldwork", "Our Fieldwork Journey", "", ""], ["03", "Collaboration & Outcomes", "Reaching beyond campus", "From documentation to connection\nOur palm-leaf manuscript coverage attracted other university fieldwork teams and researchers. In early 2025, a CCTV production team contacted us through Xiaohongshu to ask about our materials. We helped connect them with the Yunnan Provincial Intangible Cultural Heritage Protection Center; the resulting video acknowledged Shiwen Siyuan in its closing credits.\n\nFrom individual effort to shared practice\nThe team connects with cultural institutions and community partners, including the National Art Museum of China, Hangzhou Arts and Crafts Museum, and the Yunnan Provincial Intangible Cultural Heritage Protection Center. Documentary media, cultural product design, public exhibitions, and heritage workshops for university and school audiences help bring fieldwork into everyday life.\n\nThese connections grew through individual calls and emails, and through each member’s creative strengths. For me, an outcome is more than a report or an award: it is also a meeting between people who would otherwise have remained strangers.", ""], ["04", "Team Structure", "Building a framework for the team", "As team leader, I gradually built a working structure connecting internal organization with outward-facing practice: clear responsibilities, shared knowledge, and continuity within the team; courses, exchanges, exhibitions, and public cultural activities beyond it.\n\nWithin the team: learning and operations\nI helped establish visual and editorial standards, supported mentoring and shared archives, and connected vacation fieldwork with ongoing work during term. Former members continue to contribute as advisers, keeping experience available to newer members.\n\nFive complementary strands\nShiwen Chengyun focuses on heritage protection and research; Shiwen Xinya on teaching and communication; Shiwen Yali on cultural product design; Shiwen Xingsi on reflection; and Shiwen Yingxiang on arts education and exhibitions. These strands offer members with different skills and interests ways to contribute.\n\nBeyond the team: planning and collaboration\nI connected activity planning, partner outreach, and communication to help the team reach public cultural spaces. Four areas illustrate this work: campus liberal education, Beijing-wide activities, inter-university collaboration, and community engagement. The selected team records below show one example in each area.", ""], ["05", "Four Areas of Practice", "Putting the structure into action", "The team continues to develop activities through the working framework I helped establish. These records illustrate four areas of practice; dates follow the publicity log.", ""], ["06", "Reflections", "Beyond one project: helping a team endure", "“The purpose of social practice is to serve society, rather than remain within the campus.” — translated from my original essay\n\nAt first, I focused on completing fieldwork, organizing materials, and delivering outcomes. Over time, I learned to pay closer attention to team members: to help people do what they enjoy and do well, make space for different working rhythms, and support exchanges between newer and more experienced members.\n\nMy focus gradually shifted from delivering a successful project to helping the team grow. Watching new members take responsibility and introduce ideas such as visitor maps and online platforms showed me that continuity is itself a form of heritage.\n\nLooking back, my direction was not clear from the beginning. Encounters, experiments, and responsibilities gradually connected cultural observation, design practice, and research. Attention is a form of value; sustained action gives that attention a future.", ""], ["07", "Outcomes", "From fieldwork to public cultural engagement", "Communication | A multi-platform network\nArticles, videos, and online exhibitions across WeChat, Xiaohongshu, bilibili, Douyin, mini programs, and websites bring practitioners’ stories and fieldwork to younger audiences.\n\nExperience | Heritage on campus and in communities\nLiberal education workshops, exhibitions, school lessons, and public arts education translate fieldwork into participatory experiences. Examples include foil-painting lessons at Lize Middle School in winter 2025 and heritage craft classes in Lanzhou in summer 2026.\n\nTranslation | Research, design, and local applications\nOutputs range from Bei Xiaoye stickers and stationery to Zhongyang cultural products, packaging, visitor maps, and a Central Axis experience app. Summer 2026 extended this work to apple and pear branding and packaging in Suizhong.", ""], ["08", "Honors", "Shared achievements and personal growth", "Team and project honors\nFirst Prize in Beihang summer social practice (2023, 2025, and 2026); Best Practice Team in the 2023 Technology Leadership initiative; Outstanding Team in Beijing’s Youth Serving the Nation program (2023 and 2024); Second Prize in Beihang winter and summer social practice (2024); First Prize in the Social Observation track of Beihang winter social practice (2025); First Prize in Beihang winter social practice (2026).\n\nInnovation and entrepreneurship\n2025 Beijing Challenge Cup: Special Prize in the main competition and Special Prize (champion) in the Qingli Jiceng social governance track.\n\nPersonal recognition\nI received Beijing’s Youth Serving the Nation Outstanding Individual recognition and Beihang social practice honors in 2023 and 2024, as well as top-tier university social practice scholarships for 2022–2023 and 2023–2024.", ""], ["09", "Acknowledgments", "A shared commitment", "Thank you to the School of New Media Art and Design, heritage protection centers, practitioners, partner schools and cultural institutions, and all generations of team members, teachers, and supporters.\n\nI hope the working structure we have developed together continues to help new members pursue fieldwork and bring cultural heritage into everyday life.", ""]], "pending": "Content in preparation", "footer": "Adapted from my personal essays · Tuotuo Yang · With material from the team onboarding guide", "alt": "Shiwen Siyuan Practice Team group photo", "gallery": {"fieldwork": [{"src": "assets/fieldwork-collage.jpg", "caption": "Fieldwork and on-site documentation"}], "collaboration": [{"src": "assets/design-outcomes.jpg", "caption": "Cultural product designs and outcomes"}, {"src": "assets/editorial-series.png", "caption": "Editorial content and visual series"}], "continuity": [{"src": "assets/learning-resources.png", "caption": "Learning resources and knowledge sharing"}]}, "news": [{"date": "24.11.17", "platform": "微言航语", "url": "https://mp.weixin.qq.com/s?__biz=MzAxODM2Mzg3Ng==&mid=2650579852&idx=1&sn=1e978af80adbc0644085fa3dea1fbd81&chksm=820013432d3c7401974590fa3bd046feaac70da06b9e4dbc799a1f3611987044a1bd9dae7212&scene=27", "category": "01 · Campus Liberal Education", "title": "Craftsmanship liberal education workshops", "description": "Cultural learning and engagement for students on campus."}, {"date": "26.3.11", "platform": "北航校史与文博馆", "url": "https://mp.weixin.qq.com/s/ElEm0VO4NheatkYtC3VFpg", "category": "02 · Beijing-wide Activities", "title": "Mother-of-pearl craft exhibition for women educators", "description": "Bringing heritage crafts into cultural activities across Beijing’s education community."}, {"date": "24.7.31", "platform": "长安大学公路学院", "url": "https://mp.weixin.qq.com/s/LhkR6lvwma46IGHDTme6mQ", "category": "03 · Inter-university Collaboration", "title": "Joint educational outreach with a Chang’an University team", "description": "Cross-university collaboration in educational and cultural outreach."}, {"date": "24.7.23", "platform": "中阳县政府网", "url": "http://www.sxzhongyang.gov.cn/zwyw/zwyw_29948/202407/t20240723_1883759.shtml", "category": "04 · Community Engagement", "title": "Community art exhibition in Zhongyang", "description": "Bringing student artwork into rural communities and public life."}], "timeline": [["Winter 2022", "Discovering living heritage", "Huzhou & Hangzhou · First heritage visits", "Initial heritage visits and fieldwork in Huzhou and Hangzhou, Zhejiang.", "Huzhou · Hangzhou"], ["Summer 2023", "Exploring heritage in Yunnan", "Yunnan · Interviews and creative communication", "Fieldwork | Heritage encounters in Yunnan\nIn summer 2023, 13 members interviewed seven national-level, two autonomous-prefecture-level, and over 20 municipal-level heritage practitioners. Thirty hours of interviews produced more than 53,500 Chinese characters of transcripts covering origins, personal experience, challenges, and hopes for the future.\n\nCreative translation | Palm-leaf manuscripts and Bei Xiaoye\nOutputs included a palm-leaf manuscript animation, Bei Xiaoye stickers, Dai pottery necklaces, and an online exhibition. I contributed to fieldwork and editorial writing and gradually established cover, layout, and photographic guidelines.\n\nCommunication and recognition\nArticles reached over 10,000 reads and videos exceeded 36,000 views. The team received First Prize in Beihang’s 2023 summer social practice assessment, Best Practice Team in the Technology Leadership initiative, and Beijing’s Youth Serving the Nation Outstanding Team recognition.", "Yunnan"], ["Winter 2024", "Heritage and folk traditions", "Seven provinces · Local traditions", "Local traditions across seven provinces\nIn winter 2024, 15 members explored nine heritage practices through the lens of festive memories. In Donghuashi, Beijing, I encountered community-museum approaches to preservation.\n\nEditorial and design outputs\nThe team produced 25 articles, one introductory video, and three cultural product designs, alongside a paper on heritage protection and an online webpage. Bei Xiaoye sticky notes and heritage-themed stationery incorporated Beihang elements; 50 items sold within one day of launch.\n\nReturning to Huzhou\nA visit to Huzhou Cultural Center explored heritage study tours, public participation, and local Huju opera, with discussions about future school outreach.\n\nRecognition\nSecond Prize in Beihang’s winter 2024 social practice assessment.", "Seven provinces"], ["Summer 2024", "Heritage encounters in Shanxi", "Shanxi · Rural design, arts education, and teaching", "Fieldwork centered on Shanxi\nTwenty members worked for nearly two months in Shanxi and Yunnan, with Pingyao, Lüliang, and Datong forming the main Shanxi route. I could not attend the Zhongyang fieldwork in person; coordinating with the team deepened my understanding of communication and trust.\n\nDesign for local development\nThe team created more than ten sets of cultural identities and products inspired by Zhongyang paper cutting and traditional vinegar-making, nearly ten packaging and gift-box designs for local enterprises, and a Yangpo village identity combining a mascot, signs, and a visitor map.\n\nArts education and joint teaching\nThe team supported an arts-led rural practice base in Yangpo, organized the Jin–Hang art exhibition, and taught aerospace and heritage topics at Qianqingtang Middle School in Linxian.\n\nCommunication and public engagement\nA team website and 39 WeChat articles supported outreach, with followers exceeding 1,000. The season’s account records six commercial collaborations and 45 media reports. Activities included campus cultural workshops and heritage communication with international visitors from four countries and six regions.\n\nResearch and recognition\nWork on ten heritage projects produced a 60,000-character report, two papers, three Beijing undergraduate innovation projects, and 30 published works. The team received Second Prize in Beihang’s summer Social Observation track and Beijing’s Youth Serving the Nation Outstanding Team recognition in 2024.", "Shanxi"], ["Winter 2025", "Heritage along Beijing’s Central Axis", "Beijing’s Central Axis · Digital heritage", "Theme | Heritage along Beijing’s Central Axis\nThe team connected fieldwork, digital design, public education, and research through an integrated practice framework, tracing cultural roots, developing new interpretations, and sharing heritage.\n\nBuildings and living traditions\nMembers walked the 7.8 km axis and visited 15 heritage sites, collecting 1.5 hours of audiovisual records and 12,000 Chinese characters of field notes. Visits to 16 workshops and conversations with over 20 national- and provincial-level practitioners produced over ten hours of video and 90,000 characters of transcripts on 11 heritage practices.\n\nInstitutional and educational collaboration\nThe team visited No. 93 Courtyard Museum and the China National Arts and Crafts Museum, collected questionnaires, discussed youth engagement and digital communication with Xicheng’s culture and tourism authority, and delivered foil-painting lessons at Lize Middle School.\n\nDigital design and public communication\nOutputs included a reconstructed Ao motif for revolving lanterns, a Central Axis heritage map, animated Peking opera stickers, cultural products, and an app combining learning, navigation, and feedback. Over 30 articles and nearly 30 videos generated more than 30,000 video views; 20 reports across more than ten media outlets exceeded 80,000 reads.\n\nResearch and recognition\nAn 80,000-character report examined the relationship between heritage practices and the Central Axis. The team received First Prize in Beihang’s winter 2025 Social Observation track.", "Beijing"], ["Summer 2025", "Bashu heritage and collaborative branding", "Bashu heritage · Fieldwork and branding", "Fieldwork and design practice focused on the cultural heritage of Sichuan and Chongqing.\n\nRecognition\nFirst Prize in Beihang’s summer 2025 social practice assessment.", "Sichuan"], ["Winter 2026", "Following the Grand Canal", "Grand Canal · Tianjin and Shandong", "Heritage fieldwork along the canal in Tianjin and Shandong.\n\nRecognition\nFirst Prize in Beihang’s winter 2026 social practice assessment.", "Grand Canal"], ["Summer 2026", "Shared cultural identity · Belt and Road", "13 locations in five provinces · Research, design, and service", "Theme and routes | Shared cultural identity · Belt and Road\nMembers from Beihang’s three campuses and 14 schools traveled to 13 locations in Xinjiang, Gansu, Shaanxi, Jiangxi, and Liaoning, following Silk Road heritage, agricultural heritage, and revolutionary history through preparation, site visits, and digital documentation.\n\nFieldwork and research\nThe team studied 87 cultural projects, visited 22 museums and cultural venues, and interviewed 20 heritage practitioners. More than 100 hours of audio and 200,000 Chinese characters of transcripts supported an agricultural heritage paper of 20,000 characters, a comprehensive report exceeding 70,000, and an industry report of 30,000. Findings were submitted to local culture and tourism authorities.\n\nCommunication and archives\nSeven platforms carried over 20 content formats, including video diaries, illustrated articles, characters, webpages, and apps. Outputs included online exhibitions, a cultural archive app, and a heritage book. The seasonal account records 84 media reports; the team’s Central Axis film became a Beihang class-meeting resource and exceeded 10,000 views on release.\n\nDesign for local industries\nFourteen cultural product designs received seven national or provincial competition awards. Collaboration with Suizhong Agricultural Reclamation Group produced apple and pear identities and packaging, with products reaching the Shenyang Imperial Palace cultural market. Further work explored traceability, digital services, Hami melons, Lintong pomegranates, and karez irrigation heritage.\n\nPublic education and service\nIn Lanzhou, heritage craft classes served railway workers’ children and children of migrant workers. The team undertook a Beijing science association mural project, rural heritage workshops, Mid-Autumn cultural activities on Beihang’s Xueyuan Road and Shahe campuses, and a visual character for the university’s social practice course.\n\nSix connected activities and recognition\nFieldwork, research, communication, cultural product innovation, public service, and university–community collaboration formed the practice cycle. The team received First Prize in Beihang’s summer 2026 assessment. These seasonal results are kept separate from earlier cumulative figures.", "13 locations · 5 provinces"]], "overview": "Founded in December 2022, Shiwen Siyuan has grown with support from the School of New Media Art and Design. These cumulative figures come from the team overview; annual outcomes are presented separately and are not added to them.", "stats": [["85", "Members across cohorts"], ["11", "Provinces & municipalities"], ["73", "Heritage practices"], ["30+", "Exhibitions & workshops"], ["26", "Honors"]], "expand": "Explore outcomes and details", "regions": [["Beijing", "Central Axis · Donghuashi", "Traditional crafts, community heritage, and museums"], ["Shanxi", "Zhongyang · Pingyao · Datong", "Paper cutting, vinegar-making, rural design, and arts education"], ["Sichuan", "Chengdu · Mianyang · Liangshan", "Shu and Qiang embroidery, Yi crafts, and shadow puppetry"], ["Yunnan", "Kunming · Xishuangbanna", "Palm-leaf manuscripts, Dai weaving and pottery, and metal crafts"], ["Zhejiang", "Huzhou · Anji · Hangzhou", "Shuanglin silk, white tea, fan-making, and decorative arts"], ["Shandong", "Jinan · Liaocheng · Jining", "Canal heritage, book engraving, modeling crafts, and Lu brocade"], ["Tianjin", "Tianjin", "Kite-making and gourd crafts"], ["Jiangsu", "Yangzhou", "Puppetry, Qingqu singing, and guqin music"], ["Xinjiang", "Urumqi · Turpan · Hami", "Hua’er songs, Nazirkum, karez irrigation, and agricultural heritage"], ["Shaanxi", "Xi’an · Lintong", "Drum music, Qinqiang opera, papermaking, and pomegranate heritage"], ["Gansu", "Lanzhou and surrounding areas", "Heritage education and cultural fieldwork"]], "regionHeading": "Fieldwork by Region", "regionNote": "Selected places and themes drawn from in-person fieldwork records and seasonal accounts."}};const ids=["beginnings", "fieldwork", "collaboration", "continuity", "news", "reflections", "outcomes", "honors", "thanks"];function render(lang){const c=copy[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=c.title+' — Talia Yang';for(const id of ['back','title','role','subtitle','intro','site','footer'])document.getElementById(id).textContent=c[id];document.getElementById('back-bottom').textContent=c.back;document.getElementById('photo').alt=c.alt;document.getElementById('caption').textContent=c.alt;document.getElementById('zh').setAttribute('aria-pressed',lang==='zh');document.getElementById('en').setAttribute('aria-pressed',lang==='en');document.getElementById('overview').innerHTML=`<div class="team-stats">${c.stats.map(v=>`<div><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join('')}</div><p class="caption">${c.overview}</p>`;document.getElementById('nav').innerHTML=c.nav.map((v,i)=>`<a href="#${ids[i]}">${v}</a>`).join('');document.getElementById('sections').innerHTML=c.sections.map((s,i)=>`<section class="story" id="${ids[i]}"><div class="section-label"><span>${s[0]}</span>${s[1]}</div><div><h2>${s[2]}</h2>${s[3]?s[3].split("\n\n").map(p=>`<p class="known">${p.replaceAll("\n","<br>")}</p>`).join(""):''}${ids[i]==="fieldwork"?`<ol class="journey">${c.timeline.map(v=>`<li><details class="period"><summary><small>${v[0]}</small><span class="period-title">${v[1]}</span><span class="period-place">${v[4]}</span><span class="period-toggle" aria-hidden="true"></span></summary><div class="period-content">${v[3].split("\n\n").map(p=>`<p>${p.replaceAll("\n","<br>")}</p>`).join("")}</div></details></li>`).join("")}</ol><a class="archive-link" href="connections/${lang==='en'?'?lang=en':''}">${lang==='zh'?'查看联络与交流目录 →':'Explore contacts & exchanges →'}</a>`:""}${s[4]?`<div class="placeholder"><small>${c.pending}</small><p>${s[4]}</p></div>`:""}${ids[i]==="news"?`<div class="news-list">${c.news.map(v=>`<a class="news-item" href="${v.url.replaceAll("&","&amp;").replaceAll('"',"&quot;")}" target="_blank" rel="noopener noreferrer"><strong class="activity-category">${v.category}</strong><span>${v.title} ↗</span><p class="activity-description">${v.description}</p><small>${v.date} · ${v.platform}</small></a>`).join("")}</div><a class="archive-link" href="records/${lang==='en'?'?lang=en':''}">${lang==='zh'?'查看全部记录 →':'View all records →'}</a>`:""}${(c.gallery[ids[i]]||[]).map(g=>`<figure class="story-gallery"><a href="${g.src}" target="_blank" rel="noopener"><img loading="lazy" src="${g.src}" alt="${g.caption}"></a><figcaption>${g.caption}</figcaption></figure>`).join("")}</div></section>`).join('');}render(new URLSearchParams(location.search).get('lang')==='en'?'en':'zh');</script></body></html>
